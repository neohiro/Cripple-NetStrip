name: Android Gate

# Two-layer regression gate for the Android .apk target:
#   1. android-unit  — device-free Python tests of every Android-specific
#      code path (TUN packet parsing, DNS port contract, JNI-mocked platform
#      layer) plus long-duration uptime guarantees. Runs on EVERY push/PR.
#   2. apk-build-gate — real buildozer cross-compile producing a debug .apk,
#      structurally verified before being published as an artifact.
on:
  push:
    branches: [main]
    paths-ignore: ['*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Android path + longevity unit tests
        run: pytest tests/test_android.py tests/test_longevity.py -v

  apk-build-gate:
    # 24.04 glibc-2.39 headers break python-for-android's hostpython3 build
    # ('__GNUC_PREREQ not defined' under clang) — 22.04 is the blessed image
    # for buildozer/p4a cross-compiles.
    runs-on: ubuntu-22.04
    needs: android-unit
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install buildozer system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev zlib1g-dev libunwind-dev \
            libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            autoconf automake libtool libltdl-dev pkg-config unzip zip

      - name: Install buildozer
        run: |
          pip install cython==0.29.36 buildozer==1.5.0

      # Speed up subsequent gates by caching the downloaded SDK/NDK/precipes
      - name: Cache buildozer global state
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      # JCenter is dead (bintray shutdown) - p4a's bundled Gradle templates
      # still reference it, and several pinned artifacts (e.g. Kotlin RCs)
      # resolve only from Central/Google. Patch every template before build.
      - name: Patch dead jcenter() out of p4a Gradle templates
        run: |
          P4A_DIR=$(python -c "import os, pythonforandroid; print(os.path.dirname(pythonforandroid.__file__))")
          echo "p4a package at: $P4A_DIR"
          grep -rl "jcenter()" "$P4A_DIR" --include='*.gradle' --include='*.tmpl' | while read -r f; do
            sed -i 's/jcenter()/google() ; mavenCentral()/g' "$f"
            echo "patched: $f"
          done

      - name: Build debug APK (buildozer gate)
        run: |
          buildozer -v android debug > build_output.log 2>&1
          rc=$?
          echo "=== buildozer exit code: $rc ==="
          tail -150 build_output.log || true
          exit $rc

      - name: Upload raw build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: build_output.log
          retention-days: 14

      - name: Verify APK structure
        run: |
          python scripts/verify_apk.py bin/

      - name: Upload APK artifact
        if: always() && hashFiles('bin/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cripple-debug-apk
          path: bin/*.apk
          retention-days: 14
