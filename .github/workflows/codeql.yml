name: CodeQL Security Analysis

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.txt']
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  security-events: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      soft: ${{ steps.decide.outputs.soft }}
    steps:
      - name: Decide enforcement mode
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMITTER: ${{ github.event.head_commit.committer.name }}
          AGENT_ACTORS: ${{ vars.AGENT_ACTORS }}
        run: |
          soft=false
          if [ "$EVENT" = "push" ]; then
            case "$MSG" in *"[oc]"*|*"[skip-email]"*) soft=true;; esac
            if [ "$AUTHOR" = "OpenCode Agent" ]; then soft=true; fi
            if [ "$COMMITTER" = "OpenCode Agent" ]; then soft=true; fi
            if [ "$ACTOR" = "opencode-agent" ]; then soft=true; fi
            if [ -n "$AGENT_ACTORS" ]; then
              case ",$AGENT_ACTORS," in *",$ACTOR,"*) soft=true;; esac
            fi
          fi
          echo "soft=$soft"
          echo "soft=$soft" >> "$GITHUB_OUTPUT"
  analyze:
    needs: triage
    continue-on-error: ${{ needs.triage.outputs.soft == 'true' }}
    name: Analyze (python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3