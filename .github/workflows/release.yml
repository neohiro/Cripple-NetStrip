name: Auto-Build Executables

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.gitignore'
      - 'docs/**'
    branches: [ main ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to (e.g., v3.1.0)'
        required: true
        default: 'v3.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            target: linux
          - os: ubuntu-22.04
            name: Android
            target: android
          - os: macos-latest
            name: macOS
            target: macos
          - os: windows-latest
            name: Windows
            target: windows

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

          
      - name: Install System Dependencies (Linux & Android)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk build-essential libssl-dev libffi-dev python3-dev openjdk-17-jdk
          sudo apt-get install -y zip unzip autoconf libtool libltdl-dev automake autotools-dev m4 pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libstdc++6
          rustup target add aarch64-linux-android || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 3 --timeout 60 -r requirements.txt
          pip install --retries 3 --timeout 60 Pillow pyinstaller buildozer "cython==0.29.33" virtualenv maturin
          pip install -e .

      - name: Set Release Tag
        shell: bash
        run: |
          VERSION=$(python -c "import netstrip; print(netstrip.__version__)")
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v$VERSION"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Build Windows Executable
        if: matrix.target == 'windows'
        run: |
          cmd.exe /c build.bat
          if (Test-Path "dist\Cripple") {
              Compress-Archive -Path "dist\Cripple\*" -DestinationPath "NetStrip-${env:RELEASE_TAG}-Windows.zip" -Force
          } else {
              Compress-Archive -Path "dist\*" -DestinationPath "NetStrip-${env:RELEASE_TAG}-Windows.zip" -Force
          }

      - name: Build macOS Executable
        if: matrix.target == 'macos'
        run: |
          chmod +x build.sh run.sh
          bash build.sh || true
          if [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            cd dist
            zip -r ../NetStrip-${RELEASE_TAG}-macOS.zip *
            cd ..
          else
            echo "PyInstaller dist missing, creating source fallback bundle"
            zip -r NetStrip-${RELEASE_TAG}-macOS.zip main.py netstrip/ assets/ requirements.txt build.sh run.sh
          fi

      - name: Build Linux Executable
        if: matrix.target == 'linux'
        run: |
          chmod +x build.sh run.sh
          bash build.sh || true
          if [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            cd dist
            zip -r ../NetStrip-${RELEASE_TAG}-Linux.zip *
            cd ..
          else
            echo "PyInstaller dist missing, creating source fallback bundle"
            zip -r NetStrip-${RELEASE_TAG}-Linux.zip main.py netstrip/ assets/ requirements.txt build.sh run.sh
          fi

      - name: Set up Java (Android)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android Package
        if: matrix.target == 'android'
        run: |
          # No '|| true' here: a failed APK build must fail the release, not
          # silently ship a source-only zip (that lie shipped broken releases).
          yes | buildozer android debug
          mkdir -p bin
          if [ -d "bin" ] && [ "$(ls -A bin/*.apk 2>/dev/null)" ]; then
            mv bin/*.apk bin/NetStrip-${RELEASE_TAG}-Android.apk
            cd bin
            zip ../NetStrip-${RELEASE_TAG}-Android.zip NetStrip-${RELEASE_TAG}-Android.apk
            cd ..
          else
            echo "APK missing after successful exit â€” failing the release"
            exit 1
          fi

      - name: Build Windows installer (Inno Setup)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe",
                    "$env:ProgramFiles\Inno Setup 6\iscc.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { Write-Host 'iscc not found; skipping installer'; exit 0 }
          $exe = @("dist\Cripple\Cripple.exe", "dist\Cripple.exe") |
                  Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { Write-Host "built exe not found under dist\"; exit 1 }
          $ver = (Get-Item $exe).VersionInfo.ProductVersion
          if (-not $ver) { $ver = "0.0.0" }
          $exeAbs = (Resolve-Path $exe).Path
          & $iscc "/DMyAppVersion=$ver" "/DExeSource=$exeAbs" scripts\installer.iss

      - name: Generate SHA256SUMS manifest
        if: matrix.target == 'windows'
        run: |
          # Supply-chain: every published zip gets a recorded hash; users and
          # the updater can verify downloads against this manifest.
          sha256sum NetStrip-*-*.zip > SHA256SUMS.txt

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            NetStrip-*-*.zip
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
