name: Auto-Build Executables

# Per-OS native builds → single consolidated, checksummed Release.
#
# Windows ships EXACTLY ONE download: the Inno Setup installer (the portable
# zip was removed deliberately). Self-update verifies the installer against
# SHA256SUMS.txt before launching it.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: v<package version>)'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    continue-on-error: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[oc]') }}
    # Cheap guard for push-triggered runs: if this exact package version is
    # already published as a release, the rebuild would produce byte-identical
    # artifacts - skip the whole 4-OS matrix (macOS alone is a x10 minute
    # multiplier). Manual dispatches and tag pushes always rebuild.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' netstrip/__init__.py)
          echo "package version: $VERSION"
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$VERSION already released - skipping redundant rebuild"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION not yet published - building"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    continue-on-error: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[oc]') }}
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            target: linux
          - os: ubuntu-22.04
            name: Android
            target: android
          - os: macos-latest
            name: macOS
            target: macos
          - os: windows-latest
            name: Windows
            target: windows

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Linux & Android)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk build-essential libssl-dev libffi-dev python3-dev openjdk-17-jdk
          sudo apt-get install -y zip unzip autoconf libtool libltdl-dev automake autotools-dev m4 pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libstdc++6

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 3 --timeout 60 -r requirements.txt
          pip install --retries 3 --timeout 60 Pillow pyinstaller buildozer "cython==0.29.33" virtualenv maturin
          pip install -e .

      - name: Set Release Tag
        shell: bash
        run: |
          VERSION=$(python -c "import netstrip; print(netstrip.__version__)")
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v$VERSION"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      # ── Windows: PyInstaller → Inno installer (THE Windows download) ────
      - name: Build Windows Executable + Installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          cmd.exe /c build.bat
          if (-not (Test-Path "dist\Cripple\Cripple.exe")) {
              Write-Host "native exe missing - failing instead of shipping source"
              exit 1
          }
          choco install innosetup -y --no-progress
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe",
                    "$env:ProgramFiles\Inno Setup 6\iscc.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { Write-Host 'iscc not found'; exit 1 }
          $exe = (Resolve-Path "dist\Cripple\Cripple.exe").Path
          $ver = (Get-Item $exe).VersionInfo.ProductVersion
          if (-not $ver) { $ver = "0.0.0" }
          & $iscc "/DMyAppVersion=$ver" "/DExeSource=$exe" scripts\installer.iss
          $setup = Get-ChildItem "scripts\installer\*.exe" | Select-Object -First 1
          if (-not $setup) { Write-Host 'installer output missing'; exit 1 }
          Copy-Item $setup.FullName "NetStrip-Setup-$($env:RELEASE_TAG).exe"

      - name: Upload Windows installer
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: NetStrip-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

      # ── macOS: app bundle, loud-fail, verified pre/post-zip ─────────────
      - name: Set up Java (Android)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build macOS Executable
        if: matrix.target == 'macos'
        run: |
          chmod +x build.sh run.sh
          # A failed native build must fail the release — never ship source.
          bash build.sh
          test -d dist/NetStrip.app || { echo "NetStrip.app missing — failing release"; exit 1; }
          cd dist
          zip -r ../NetStrip-${RELEASE_TAG}-macOS.zip NetStrip.app
          cd ..
          unzip -l NetStrip-${RELEASE_TAG}-macOS.zip | grep -q "NetStrip.app/Contents/MacOS/" \
            || { echo "Mach-O binary absent from published zip"; exit 1; }

      - name: Upload macOS zip
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: NetStrip-*.zip
          if-no-files-found: error
          retention-days: 7

      # ── Linux: binary + desktop entry, loud-fail, verified ──────────────
      - name: Build Linux Executable
        if: matrix.target == 'linux'
        run: |
          chmod +x build.sh run.sh
          bash build.sh
          test -x dist/NetStrip/NetStrip || { echo "native binary missing — failing release"; exit 1; }
          cd dist
          zip -r ../NetStrip-${RELEASE_TAG}-Linux.zip NetStrip
          cd ..
          unzip -l NetStrip-${RELEASE_TAG}-Linux.zip | grep -q "NetStrip/NetStrip" \
            || { echo "executable absent from published zip"; exit 1; }

      - name: Upload Linux zip
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: NetStrip-*.zip
          if-no-files-found: error
          retention-days: 7

      # ── Android: APK via pinned toolchain, loud-fail ────────────────────
      - name: Build Android Package
        if: matrix.target == 'android'
        run: |
          yes | buildozer android debug
          mkdir -p bin
          if [ -d "bin" ] && [ "$(ls -A bin/*.apk 2>/dev/null)" ]; then
            mv bin/*.apk bin/NetStrip-${RELEASE_TAG}-Android.apk
            cd bin
            zip ../NetStrip-${RELEASE_TAG}-Android.zip NetStrip-${RELEASE_TAG}-Android.apk
            cd ..
          else
            echo "APK missing after successful exit — failing the release"
            exit 1
          fi

      - name: Upload Android zip
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-zip
          path: NetStrip-*.zip
          if-no-files-found: error
          retention-days: 7

  # ── Consolidated, fully-checksummed publication ─────────────────────────
  publish:
    continue-on-error: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[oc]') }}
    name: Publish Release (all OS + SHA256SUMS)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (resolve version)
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve release tag
        shell: bash
        run: |
          VERSION=$(python -c "import netstrip; print(netstrip.__version__)")
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="v$VERSION"; fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate SHA256SUMS over EVERY published file
        shell: bash
        run: |
          cd release
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release (idempotent — stale assets purged)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="$RELEASE_TAG"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "NetStrip $TAG" \
              --notes "Native builds for Windows (installer), Linux, macOS and Android. SHA256SUMS.txt covers every asset."
          # Idempotent re-publish: purge stale assets so there is never more
          # than one download per platform.
          RID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.id')
          gh api "repos/${{ github.repository }}/releases/$RID/assets" --jq '.[].id' \
            | while read -r aid; do
                gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$aid"
              done
          gh release upload "$TAG" release/* --clobber
