name: Version Bump

# Single-source versioning: bump the version in one place and this workflow
# propagates it to every embedded location (package, setup, buildozer,
# PyInstaller metadata) and verifies consistency in one commit.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (X.Y.Z), e.g. 3.7.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bump version everywhere
        run: python scripts/bump_version.py "${{ inputs.version }}"

      - name: Commit propagated versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add netstrip/__init__.py setup.py buildozer.spec version_info.txt
          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "Bump version to v${{ inputs.version }} [skip ci]"
            git push
          fi

  verify:
    runs-on: ubuntu-latest
    needs: bump
    steps:
      - name: Checkout (post-bump)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify version consistency
        run: python scripts/bump_version.py --check
