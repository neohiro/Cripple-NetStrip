name: Version Bump

# Single-source versioning: bump the version in one place and this workflow
# propagates it to every embedded location (package, setup, buildozer,
# PyInstaller metadata) and verifies consistency in one commit.
#
# main is protected, so the bump cannot be pushed directly. This opens a pull
# request instead, and `verify` runs against the bumped ref so the consistency
# check still gates the change before it lands.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (X.Y.Z), e.g. 3.7.0'
        required: true
        type: string

# A second dispatch while one is running would force-push a different version
# to the same automation branch and silently win, leaving the PR title and the
# tree disagreeing. Serialise them.
concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: automation/version-bump

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.push.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bump version everywhere
        run: python scripts/bump_version.py "${{ inputs.version }}"

      - name: Commit and open pull request
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add netstrip/__init__.py setup.py buildozer.spec version_info.txt

          if git diff --cached --quiet; then
            echo "No version changes to commit; nothing to do."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Bump version to v${VERSION} [skip ci]"
          git push --force origin "HEAD:refs/heads/$BRANCH"

          number=$(gh pr list --head "$BRANCH" --state open --json number \
            --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            echo "Updated existing PR #${number}"
            gh pr comment "$number" --body "Bumped to v${VERSION} by run ${GITHUB_RUN_ID}."
          else
            gh pr create \
              --head "$BRANCH" \
              --base main \
              --title "chore: bump version to v${VERSION}" \
              --body "Propagated \`${VERSION}\` to every embedded location by \`.github/workflows/version-bump.yml\`. The \`verify\` job checks consistency against this ref."
          fi
          echo "bumped=true" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    needs: bump
    if: needs.bump.outputs.bumped == 'true'
    steps:
      # Check out the bumped ref, not main: the change is not on main until the
      # PR merges, so verifying main here would check the old version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify version consistency
        run: python scripts/bump_version.py --check