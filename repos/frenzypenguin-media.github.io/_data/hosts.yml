# =============================================================================
# _data/hosts.yml — SINGLE SOURCE OF TRUTH for every subdomain in the
# frenzypenguin.media DNS zone, plus the four derived aliases that redirect
# into it.
#
# WHAT A RECORD IS
#   slug       the label, and therefore the path: /<slug>/ (artists: /artists/<slug>/)
#   type       url | url301  — verbatim from the DNS export. url301 means the
#              operator flagged it as a permanent redirect to somewhere else, so
#              `target` is set and `url` is the address the visitor should use.
#   category   one of the keys under `categories:` below
#   url        the address a visitor should actually use
#   source     the address as it appears in the DNS zone, kept even when it is
#              broken — it is the thing that has to be fixed, so it must not be
#              quietly replaced by the working `url`
#   status     ok | guarded | down | broken-dns
#              ok       answered 2xx/3xx to a plain GET with a browser UA
#              guarded  alive, but a bot wall (403/429/400/999) answered instead.
#                       These render as live; they are unverified, not broken.
#              down     no answer: connect refused, TCP timeout, or 404
#              broken-dns the name resolves but cannot be served (see `note`)
#   checked    ISO date of the last probe
#
# PROBING RULES (scripts/check-hosts.ps1 is the reference implementation)
#   GET, not HEAD — several of these hosts answer HEAD with 405/403 and look
#   dead when they are not. Follow up to 8 redirects. Browser UA + no keepalive.
#   A bot wall is NOT a dead link. 403/429/400/999 all mean "a human in a
#   browser would get through", so they are recorded as guarded.
#   A TLS trust failure is a DNS finding, not a dead page: www.frenzypenguin.media
#   is a CNAME to frenzypenguin-media.github.io, and GitHub Pages does not issue
#   a certificate for the www host. The apex does resolve. Hence broken-dns.
#
# TO RE-PROBE:  powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-hosts.ps1
# TO REGENERATE the category pages after editing this file:
#   powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-host-pages.ps1
# =============================================================================

categories:
  artists:
    title: "Artists"
    symbol: "🎧"
    tagline: "Acts and channels on the decks"
    blurb: >-
      DJ and electronic-music acts, plus the audio channels the island runs.
      Every page here carries a bio frame that is deliberately half-empty:
      fill in the slots and the page is finished.
    accent: "#ff2e97"
  social:
    title: "Social"
    symbol: "📢"
    tagline: "Where to follow, watch and talk"
    blurb: >-
      The accounts. Every handle in this group is mirrored from the DNS zone and
      re-checked on each probe, because social handles rot faster than anything
      else here.
    accent: "#26c6da"
  commerce:
    title: "Commerce"
    symbol: "🛒"
    tagline: "Booking, money and the front door"
    blurb: >-
      The four addresses that turn a visitor into a booking, a customer or a
      supporter. These are the buttons that matter most on any page, so they are
      the ones promoted to the top of the island guide.
    accent: "#ffa726"
  stage:
    title: "Stage"
    symbol: "🎸"
    tagline: "The venue itself, in and around Second Life"
    blurb: >-
      The island's physical and scheduling addresses: the landmark, the weekly
      timetable, and the map coordinates you teleport to.
    accent: "#66bb6a"
  web:
    title: "Web"
    symbol: "🌐"
    tagline: "Sites, tools and infrastructure"
    blurb: >-
      Infrastructure and the odd internal tool. The entries in this group are
      the ones that went stale during the rebuild and still need an owner.
    accent: "#9d7aff"

