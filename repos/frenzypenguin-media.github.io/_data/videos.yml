# FPM video catalogue — the real, verifiable back catalogue.
#
# WHY THIS FILE EXISTS
# --------------------
# assets/js/main.js used to build the homepage video grid from a hard-coded
# array in which all six entries carried the same id, dQw4w9WgXcQ — which
# YouTube's oEmbed API resolves to "Rick Astley – Never Gonna Give You Up".
# Every card paired that placeholder with an invented title, an invented
# duration and an invented view count ("Windows Hardening Deep Dive · 124K
# views"). It rendered as a plausible, finished media wall and was entirely
# fictional. That is precisely the failure this project documents elsewhere:
# "an honest blank is more useful than a placeholder sentence, because a
# placeholder looks finished."
#
# So the wall below is the actual catalogue, and it is not a security
# tutorial channel. FPM is an audiovisual studio in Belgium (founded 2015):
# DJ-set livestreams, one showreel, a numbered radio series and a pyro short.
# The site's old copy promised "weekly security engineering content" that does
# not exist on the channel. The homepage no longer claims it.
#
# PROVENANCE / HOW TO VERIFY
# --------------------------
# Every id below was resolved through YouTube's own oEmbed endpoint, which
# returns server-side metadata and cannot report an author it does not own:
#
#   https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=VIDEO_ID&format=json
#
# All 22 returned author_name "FrenzyPenguin Media" and
# author_url https://www.youtube.com/@FrenzyPenguinMedia. Re-run that call to
# re-verify any row; if it 404s, the id is wrong and the row must go.
#
# `views` is a rounded, human-facing figure scraped at verification time and is
# therefore approximate and will age. It is presentation only — never sort on it
# and never treat it as exact. `year` comes from the title where the uploader
# put it there ("… 2019 …"); `featured` is editorial ordering by hand.
#
# `duration` is deliberately absent: YouTube's oEmbed does not return duration,
# and guessing it would repeat the sin this file exists to fix. The player shows
# real duration once loaded; the facade does not claim one.

channel:
  name: "FrenzyPenguin Media"
  handle: "https://www.youtube.com/@FrenzyPenguinMedia"
  gaming_handle: "https://www.youtube.com/@FrenzyPenguinGaming"
  # Second channel, shown on the channel row. 176 subs vs 1.27K on the main one.
  bluesky: "https://bsky.app/profile/frenzypenguin.media"
  linkedin: "https://linkedin.com/company/frenzypenguin-media"

# Ordered by hand, not by scraped views: the reel leads because it is the only
# thing on the channel that represents the whole studio, then the three Triquetra
# hardware/analog live sets (the actual core of the catalogue), then one set
# from each other billing so no era or genre is unrepresented.
